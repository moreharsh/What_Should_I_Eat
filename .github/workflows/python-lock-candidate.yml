name: Python Runtime Lock Candidate
on:
  pull_request:
    paths:
      - backend/requirements.txt
      - .github/workflows/python-lock-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    name: Resolve Python 3.11 runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Resolve runtime dependencies and print exact candidate versions
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          echo 'START_PYTHON_RUNTIME_LOCK'
          python -m pip freeze --exclude-editable
          echo 'END_PYTHON_RUNTIME_LOCK'
