name: Repository Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint (Oxlint)
        run: npm run lint
      - name: Type-check JavaScript and JSX (TypeScript checkJs)
        run: npx --yes --package typescript@5.9.3 tsc --project jsconfig.json
      - name: Frontend API and race tests
        run: node --test tests/*.test.mjs
      - name: Production build
        run: npm run build

  backend:
    name: Backend syntax, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install quality tools
        run: python -m pip install ruff==0.14.6 'fastapi>=0.110' 'httpx2>=0.1' 'pydantic>=2' 'langgraph>=1.0,<2'
      - name: Compile Python modules
        run: python -m compileall -q backend
      - name: Check Python correctness rules
        run: ruff check backend --select E4,E7,E9,F63,F7,F82
      - name: Run dependency-free unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  spelling:
    name: Spelling (CSpell)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check source and documentation spelling
        run: npx --yes cspell@8.19.4 --config cspell.json --no-progress "ReadMe.md" "CONTRIBUTING.md" "SECURITY.md" ".github/*.md" "frontend/README.md" "frontend/src/**/*.{js,jsx,css}" "backend/**/*.py"

  hygiene:
    name: Git whitespace and conflict markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" HEAD
      - name: Check for unresolved merge markers
        run: |
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!frontend/package-lock.json'; then
            echo "Unresolved conflict marker found."
            exit 1
          fi
