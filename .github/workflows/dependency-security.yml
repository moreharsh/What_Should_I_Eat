name: Dependency Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Detect newly disclosed advisories even when the repository is unchanged.
    - cron: '43 9 * * 2'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: Frontend dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install lockfile dependencies
        run: npm ci --ignore-scripts
      - name: Fail on high or critical npm vulnerabilities
        run: npm audit --audit-level=high

  python-audit:
    name: Backend dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned dependency auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit resolved backend runtime dependencies
        run: python -m pip_audit --requirement backend/requirements.txt --progress-spinner off
