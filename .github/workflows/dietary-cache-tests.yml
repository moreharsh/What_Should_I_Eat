name: Dietary cache regression tests

on:
  pull_request:
    paths:
      - 'backend/recipe_cache.py'
      - 'backend/dietary_validation.py'
      - 'backend/main.py'
      - 'backend/schemas.py'
      - 'frontend/src/App.jsx'
      - 'backend/tests/**'
      - '.github/workflows/dietary-cache-tests.yml'
  push:
    branches:
      - fix/issue-2-dietary-cache-isolation

jobs:
  dietary-cache-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API test dependencies
        run: python -m pip install 'fastapi>=0.110' 'httpx>=0.27' 'pydantic>=2'
      - name: Run isolated and mocked API regression tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
