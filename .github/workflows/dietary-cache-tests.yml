name: Dietary cache regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dietary-cache-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install API test dependencies
        run: python -m pip install 'fastapi>=0.110' 'httpx2>=0.1' 'pydantic>=2' 'langgraph>=1.0,<2'
      - name: Run isolated and mocked API regression tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
