name: Dietary cache regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dietary-cache-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt
      - name: Install pinned runtime and CI dependencies
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements-ci.txt
          python -m pip check
      - name: Run isolated and mocked API regression tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
