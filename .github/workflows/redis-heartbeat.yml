name: Redis Cloud activity heartbeat

on:
  schedule:
    # Monday + Thursday, UTC. Redis Cloud Free evaluation databases may be
    # deleted after 14 days of no commands. GitHub schedules can be delayed.
    - cron: '17 10 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redis-cloud-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Ping Redis heartbeat API
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate configuration
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          REDIS_HEARTBEAT_TOKEN: ${{ secrets.REDIS_HEARTBEAT_TOKEN }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ] || [ -z "$REDIS_HEARTBEAT_TOKEN" ]; then
            echo "::error::Set repository variable BACKEND_BASE_URL and secret REDIS_HEARTBEAT_TOKEN."
            exit 1
          fi
          case "$BACKEND_BASE_URL" in
            https://*) ;;
            *) echo "::error::BACKEND_BASE_URL must use HTTPS."; exit 1 ;;
          esac
      - name: Write timestamp to Redis through backend
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          REDIS_HEARTBEAT_TOKEN: ${{ secrets.REDIS_HEARTBEAT_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --request POST \
            --header "X-Heartbeat-Token: ${REDIS_HEARTBEAT_TOKEN}" \
            --url "${BACKEND_BASE_URL%/}/api/maintenance/redis-heartbeat"
